steps:

- task: UseDotNet@2 # Needed by some of our test resources
  displayName: Install .NET 8
  inputs:
    packageType: sdk
    version: 8.x

- task: UseDotNet@2 # The pinned SDK we use to build
  displayName: Install .NET SDK from global.json
  inputs:
    packageType: sdk
    useGlobalJson: true
