parameters:
- name: sign
  displayName: Sign Files (release/* always signed)
  type: boolean
  default: true
- name: skipStorage
  type: boolean
  default: false

trigger:
  batch: true
  branches:
    include:
    - dev
    - release/*

schedules:
# Ensure we build nightly to catch any new CVEs and report SDL often.
- cron: "0 3 * * *"
  displayName: Nightly Build
  branches:
    include:
    - dev
    - release/*
  always: true

# CI only, does not trigger on PRs.
pr: none

resources:
  repositories:
  - repository: 1es
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
  - repository: eng
    type: git
    name: engineering
    ref: refs/tags/release

variables:
- template: /eng/ci/templates/variables/build.yml@self
- template: /ci/variables/cfs.yml@eng
- name: sign
  readonly: true
  ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/release/') }}:
    value: true
  ${{ else }}:
    value: ${{ parameters.sign }}

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc
      image: 1es-windows-2022
      os: windows
      ${{ if eq( variables['Build.Reason'], 'Schedule' ) }}:
        demands:
        - Priority -equals Low

    sdl:
      codeql:
        # Move codeql for source languages to source analysis stage
        runSourceLanguagesInSourceAnalysis: true

    stages:
    - stage: Build
      jobs:
      - template: /eng/ci/templates/jobs/build.yml@self
        parameters:
          official: ${{ variables.sign }}
          skipStorage: ${{ parameters.skipStorage }}

    - stage: Test
      dependsOn: '' # Run in parallel
      jobs:
      - template: /eng/ci/templates/jobs/run-integration-tests.yml@self
